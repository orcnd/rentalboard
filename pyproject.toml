[project]
name = "rentalboard"
version = "0.1.0"
description = "Multi-tenant equipment rental calendar with atomic conflict protection"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "bcrypt==5.0.0"]

[dependency-groups]
dev = ["uvicorn>=0.30", "httpx>=0.27", "pytest>=8", "workers-py", "workers-runtime-sdk", "bandit>=1.8,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
